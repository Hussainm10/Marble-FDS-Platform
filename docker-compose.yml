name: marble-fds

x-backend-image: &backend-image
  image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:v0.59.0
x-frontend-image: &frontend-image
  image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-frontend:v0.59.1

x-backend-env: &backend-env
  LICENSE_KEY: ${LICENSE_KEY:-LICENSE_KEY}
  PORT: 8080
  MARBLE_APP_URL: http://localhost:${APP_PORT:-3000}
  PG_HOSTNAME: db
  PG_PORT: ${PG_PORT:-5432}
  PG_USER: ${PG_USER:-postgres}
  PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
  PG_DATABASE: ${PG_DATABASE:-marble}
  AUTHENTICATION_JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
  # Firebase Auth — real project (Spark/free tier).
  # Backend uses Firebase Admin SDK to verify ID tokens; needs the service-account
  # JSON mounted into the api/cron containers (see `volumes` on those services).
  # To switch back to the emulator: uncomment the EMULATOR_HOST line, replace the
  # env-var refs with `placeholder`/`test-project`, drop the GOOGLE_APPLICATION_CREDENTIALS
  # line, and `docker compose up -d firebase_auth api cron app`.
  # FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
  FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Set FIREBASE_API_KEY in .env}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
  FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?Set FIREBASE_AUTH_DOMAIN in .env}
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
  # Organization bootstrap
  CREATE_ORG_NAME: ${CREATE_ORG_NAME:-MarbleFDS}
  CREATE_ORG_ADMIN_EMAIL: ${CREATE_ORG_ADMIN_EMAIL:-admin@example.com}
  # Bucket URLs (leave empty for dev; no blob storage needed initially)
  INGESTION_BUCKET_URL: ${INGESTION_BUCKET_URL:-}
  CASE_MANAGER_BUCKET_URL: ${CASE_MANAGER_BUCKET_URL:-}
  ANALYTICS_BUCKET_URL: ${ANALYTICS_BUCKET_URL:-}

x-frontend-env: &frontend-env
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  SESSION_MAX_AGE: "43200"
  MARBLE_API_URL: http://api:8080
  MARBLE_APP_URL: http://localhost:${APP_PORT:-3000}
  # Firebase Auth — real project. See backend block above for rollback notes.
  # FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
  FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Set FIREBASE_API_KEY in .env}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
  FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?Set FIREBASE_AUTH_DOMAIN in .env}
  # TEST_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

services:
  # --- PostgreSQL ---
  db:
    container_name: marble-postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DATABASE:-marble}
      PGDATA: /data/postgres
      PGPORT: ${PG_PORT:-5432}
    ports:
      - "${PG_PORT:-5432}:${PG_PORT:-5432}"
    volumes:
      - marble-db:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 2s
      timeout: 1s
      retries: 5

  # --- Marble Backend (API + Migrations) ---
  api: &backend
    <<: *backend-image
    container_name: marble-api
    platform: linux/amd64
    restart: always
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["./app", "--server", "--migrations"]
    healthcheck:
      disable: true
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - marble-tempfiles:/tempFiles
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-sa.json:ro
    environment:
      <<: *backend-env

  # --- Marble Backend (Worker) ---
  cron:
    <<: *backend
    container_name: marble-api-cron
    depends_on:
      - api
    entrypoint: ["./app", "--worker"]
    healthcheck:
      disable: true
    ports: []

  # --- Marble Frontend ---
  app:
    <<: *frontend-image
    container_name: marble-app
    platform: linux/amd64
    restart: always
    depends_on:
      - api
      - firebase_auth
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - --input-type=module
        - -e
        - "process.exit((await fetch('http://localhost:8080/healthcheck')).status == 200 ? 0 : 1)"
      interval: 10s
      timeout: 60s
      retries: 3
      start_period: 30s
    ports:
      - "${APP_PORT:-3000}:8080"
    environment:
      <<: *frontend-env

  # --- Firebase Auth Emulator (for local dev) ---
  firebase_auth:
    container_name: firebase-auth
    image: europe-west1-docker.pkg.dev/marble-infra/marble/firebase-emulator:latest
    restart: always
    ports:
      - "9099:9099"
      - "4000:4000"

  # --- Marbel ML Behavioral Engine ---
  marbel:
    build:
      context: ./bridge
      dockerfile: marbel_stub/Dockerfile
    container_name: marbel-ml
    restart: always
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- GNN Graph Fraud Engine ---
  gnn:
    build:
      context: ./bridge
      dockerfile: gnn_stub/Dockerfile
    container_name: gnn-ml
    restart: always
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # --- Bridge Service (Marbel/GNN escalation) ---
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: marble-bridge
    restart: always
    ports:
      - "${BRIDGE_PORT:-8000}:8000"
    environment:
      CHECKMARBLE_API_URL: http://api:8080
      CHECKMARBLE_API_KEY: ${CHECKMARBLE_API_KEY:-}
      MARBEL_API_URL: ${MARBEL_API_URL:-http://marbel:5000}
      GNN_API_URL: ${GNN_API_URL:-http://gnn:5001}
      MARBEL_ESCALATION_THRESHOLD: ${MARBEL_ESCALATION_THRESHOLD:-40}
      GNN_ESCALATION_THRESHOLD: ${GNN_ESCALATION_THRESHOLD:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # the platform's compliance hard-lock policy §M4 visibility gate. "minimal" for production
      # (customer-facing minimal response by default; full payload only
      # when X-Compliance-Role header is whitelisted). "verbose" for
      # dev/test (full payload always returned, header ignored).
      BRIDGE_RESPONSE_MODE: ${BRIDGE_RESPONSE_MODE:-verbose}
      # AML/CTR/STR thresholds — override per-jurisdiction via env vars.
      CTR_AMOUNT_THRESHOLD: ${CTR_AMOUNT_THRESHOLD:-500000}
      STR_SCORE_THRESHOLD: ${STR_SCORE_THRESHOLD:-40}
      AUDIT_RETENTION_DAYS_GENERAL: ${AUDIT_RETENTION_DAYS_GENERAL:-2557}
      AUDIT_RETENTION_DAYS_AML: ${AUDIT_RETENTION_DAYS_AML:-3650}
    volumes:
      # Jurisdiction-pack seed data (tier limits, custom lists) is read from
      # here at boot; mount as read-only so the bridge cannot write to it.
      - ./seed_data:/seed_data:ro
    depends_on:
      - api
      - marbel
      - gnn
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Risk Score Decay Cron ---
  decay:
    build:
      context: ./bridge/decay
      dockerfile: Dockerfile
    container_name: risk-decay-cron
    restart: always
    environment:
      PG_HOSTNAME: db
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      PG_DATABASE: ${PG_DATABASE:-marble}
      CHECKMARBLE_API_URL: http://api:8080
      CHECKMARBLE_API_KEY: ${CHECKMARBLE_API_KEY:-}
      DECAY_INTERVAL_HOURS: ${DECAY_INTERVAL_HOURS:-24}
      STARTUP_DELAY_SECONDS: ${DECAY_STARTUP_DELAY:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  marble-db:
    driver: local
  marble-tempfiles:
